[package]
name = "keeps-desktop"
version = "0.6.2"
description = "Keeps as its own Mac app"
authors = ["ccez"]
edition = "2021"

[lib]
# `_lib` keeps the lib name apart from the bin (Windows cargo#8519).
name = "keeps_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# API calls leave from Rust (src/api.rs), so the device token never
# reaches the page and no CORS is involved. rustls: no OpenSSL to link.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
url = "2"
# The six-hourly update timer (tokio is tauri's runtime already).
tokio = { version = "1", features = ["time"] }

# Webview snapshot for headless verification (src/snapshot.rs):
# WKWebView renders its own pixels, so no Screen Recording permission.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
