name: deploy

# Ship the Worker + SPA to keeps.cstraka.dev. Pushes to main (and PRs, for
# the gate) run tests + typecheck; main also rebuilds dist/, applies D1
# migrations to the remote database, and deploys. There is deliberately no
# deploy on tags — release.yml owns tags for the Android APK.
#
# One-time setup (repo Settings -> Secrets -> Actions):
#   CLOUDFLARE_API_TOKEN   API token from the "Edit Cloudflare Workers"
#                          template, plus D1:Edit (dash -> My Profile ->
#                          API Tokens -> Create Token).
#   CLOUDFLARE_ACCOUNT_ID  Account ID (Workers dashboard URL, or
#                          `wrangler whoami`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bunx tsc --noEmit

  deploy:
    needs: [test-web]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Apply D1 migrations (remote)
        run: bunx wrangler@4 d1 migrations apply ccez-keeps --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy worker + assets
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
