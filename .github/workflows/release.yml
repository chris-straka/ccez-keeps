name: release

# Cut a release: push a tag like `v0.1.0` and CI attaches an installable
# APK (plus its `.sha256`) to a published GitHub Release. From v0.5.3 the
# app finds, verifies and installs it by itself (android/.../update/);
# the Releases page is only needed for the first install.
#
# From v0.6.0 the same release carries the Mac app (desktop/, Tauri):
# per-arch .dmgs, the updater tarballs with their .sig, and latest.json,
# which the installed app polls (desktop/src/update.rs). The tag is the
# version for both apps: the Mac legs pass it to `tauri build --config`.
# Updater signing (Mac): TAURI_SIGNING_PRIVATE_KEY (~/.tauri/keeps.key on
# y8) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD; the public half is
# plugins.updater.pubkey in desktop/tauri.conf.json. The .app is ad-hoc
# signed (no Apple account), like ccez-llm (docs/desktop.md).
#
# One-time setup before the first release (repo Settings -> Secrets ->
# Actions), optional but recommended so updates install over each other
# (`keytool -genkey -v -keystore ~/keeps-upload.jks -keyalg RSA
# -keysize 2048 -validity 10000 -alias upload`, same password twice):
#   KEEPS_KEYSTORE_BASE64  (`base64 -i ~/keeps-upload.jks | pbcopy`)
#   KEEPS_KEYSTORE_PASSWORD
#   KEEPS_KEY_ALIAS          (e.g. `upload`)
#   KEEPS_KEY_PASSWORD       (may equal the store password)
# Without them the APK is debug-signed: installs fine standalone, but a
# later switch to the upload key requires uninstalling first.
#
# ORDERING (borrowed from ccez-llm release.yml): the builder holds only
# `contents: read` and publishes the APK as a workflow artifact; the
# serial tail job `release` is the SOLE writer to the GitHub Release
# (create + attach + verify + publish). `prune-old-releases` only
# deletes older releases, never the current one.

on:
  push:
    tags:
      - "v*"

jobs:
  # Web gate: never cut an APK on top of a broken web build or suite.
  test-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test
      - run: bunx tsc --noEmit

  build:
    needs: [test-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use the runner's preinstalled Android SDK
        # No setup-android action: its default package set includes the
        # long-removed `tools` package and fails on current runners.
        # ubuntu-latest already ships cmdline-tools + platform-tools.
        run: |
          # NOTE: GITHUB_PATH takes effect in the NEXT step, so this step
          # calls sdkmanager by absolute path.
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Write keystore from secrets (optional)
        # No `if:` on secrets here: the secrets context is not available
        # in step conditions, so the shell branches instead. When unset,
        # app/build.gradle.kts falls back to a debug-signed release build.
        env:
          KEEPS_KEYSTORE_BASE64: ${{ secrets.KEEPS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEEPS_KEYSTORE_BASE64" ]; then
            echo "No keystore secret; release build will be debug-signed."
            exit 0
          fi
          echo "$KEEPS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keeps-release.jks"
          echo "KEEPS_KEYSTORE_PATH=$RUNNER_TEMP/keeps-release.jks" >> "$GITHUB_ENV"
      - name: Unit tests + signed release APK
        env:
          KEEPS_KEYSTORE_PASSWORD: ${{ secrets.KEEPS_KEYSTORE_PASSWORD }}
          KEEPS_KEY_ALIAS: ${{ secrets.KEEPS_KEY_ALIAS }}
          KEEPS_KEY_PASSWORD: ${{ secrets.KEEPS_KEY_PASSWORD }}
        run: ./gradlew :synclogic:test :app:assembleRelease -PVERSION_NAME=${GITHUB_REF_NAME}
      - name: Upload APK as workflow artifact
        # NOTE: uses-steps ignore defaults.run.working-directory, so this
        # path is repo-relative, not android-relative.
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Mac app legs, parallel to the APK build. Read-only like it: bundles
  # leave as workflow artifacts and only the tail job touches the release.
  build-macos:
    needs: [test-web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            rust_target: aarch64-apple-darwin
          - name: macos-x86_64
            rust_target: x86_64-apple-darwin
    name: build (${{ matrix.name }})
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - run: bun install
      - name: Rust unit tests
        if: matrix.name == 'macos-aarch64'
        working-directory: desktop
        run: cargo test
      - name: Build the app, .dmg and signed updater tarball
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bunx tauri build --target ${{ matrix.rust_target }} --config "{\"version\":\"$VERSION\"}"
      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: |
            desktop/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            desktop/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz
            desktop/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # Serial tail: the SOLE writer to the release. Runs only after every
  # builder is green, renames the bundles, writes the Mac updater
  # manifest, attaches everything to a draft, verifies the draft, then
  # publishes it.
  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: bundles
      - name: Download Mac bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-macos-*
          path: mac
      - name: Rename APK for the release page
        run: |
          mkdir -p release-assets
          cp bundles/app-release.apk "release-assets/Keeps-android-${GITHUB_REF_NAME}.apk"
          # The app's self-updater checks the APK against this before
          # installing (as well as GitHub's own asset digest).
          (cd release-assets && sha256sum "Keeps-android-${GITHUB_REF_NAME}.apk" > "Keeps-android-${GITHUB_REF_NAME}.apk.sha256")
          cat release-assets/*.sha256
      - name: Rename Mac bundles and write the updater manifest
        # latest.json points at public releases/download URLs (the
        # ccez-llm lesson: API asset URLs 404 for the updater) and carries
        # each tarball's .sig contents. Fails on any missing file.
        run: |
          python3 - mac release-assets "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" <<'EOF'
          import datetime, glob, json, os, shutil, sys

          src, dest, ref, repo = sys.argv[1:5]
          legs = {"macos-aarch64": "apple-silicon", "macos-x86_64": "intel"}
          keys = {"apple-silicon": ["darwin-aarch64", "darwin-aarch64-app"],
                  "intel": ["darwin-x86_64", "darwin-x86_64-app"]}

          def one(pattern):
              found = glob.glob(pattern, recursive=True)
              if len(found) != 1:
                  sys.exit(f"MISSING or ambiguous: {pattern} -> {found}")
              return found[0]

          dl = f"https://github.com/{repo}/releases/download/{ref}"
          platforms = {}
          for leg, arch in legs.items():
              base = f"{src}/bundle-{leg}"
              dmg = one(f"{base}/**/*.dmg")
              tar = one(f"{base}/**/*.app.tar.gz")
              sig = one(f"{base}/**/*.app.tar.gz.sig")
              shutil.copyfile(dmg, f"{dest}/Keeps-macos-{arch}.dmg")
              shutil.copyfile(tar, f"{dest}/Keeps-macos-{arch}.app.tar.gz")
              shutil.copyfile(sig, f"{dest}/Keeps-macos-{arch}.app.tar.gz.sig")
              entry = {"signature": open(sig).read().strip(),
                       "url": f"{dl}/Keeps-macos-{arch}.app.tar.gz"}
              for key in keys[arch]:
                  platforms[key] = entry
          manifest = {
              "version": ref[1:] if ref.startswith("v") else ref,
              "notes": "",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z"),
              "platforms": platforms,
          }
          with open(f"{dest}/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("manifest platforms:", ", ".join(sorted(platforms)))
          EOF
          ls -la release-assets/
      - name: Create draft and attach APK (sole release writer)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Keeps ${{ github.ref_name }}"
          draft: true
          generate_release_notes: true
          files: release-assets/*
      - name: Verify the draft, then publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WANT="Keeps-android-${GITHUB_REF_NAME}.apk
          Keeps-macos-apple-silicon.dmg
          Keeps-macos-apple-silicon.app.tar.gz
          Keeps-macos-apple-silicon.app.tar.gz.sig
          Keeps-macos-intel.dmg
          Keeps-macos-intel.app.tar.gz
          Keeps-macos-intel.app.tar.gz.sig
          latest.json"
          for i in 1 2 3; do
            HAVE="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            missing=""
            for f in $WANT; do
              echo "$HAVE" | grep -qxF "$f" || missing="$missing $f"
            done
            if [ -z "$missing" ]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
              test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "false"
              exit 0
            fi
            echo "not visible yet:$missing (attempt $i/3), retrying in 15s..."
            sleep 15
          done
          echo "MISSING:$missing"
          exit 1

  # Tidiness: once the release above is verified, delete every older
  # release except the newest previous one (kept as a rollback
  # fallback). Runs last so it can never endanger the current APK.
  prune-old-releases:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete releases older than the previous one
        # The list query runs seconds after publishing, when the API
        # occasionally 500s on read-after-write; `gh release list` has
        # also exited 1 on runners where it works locally, so failures
        # print stderr for diagnosis and fall back to the REST API.
        # Real breakage still fails loudly after the third attempt.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if python3 - <<'EOF'
          
          import json
          import os
          import subprocess
          # This job has no checkout, so every gh call names the repo
          # explicitly (-R) instead of relying on git remote discovery.
          repo = os.environ["GITHUB_REPOSITORY"]

          def query_releases():
              """Newest-first release list, CLI first with REST fallback."""
              try:
                  out = subprocess.run(
                      ["gh", "release", "list", "-R", repo,
                       "--json", "tagName,createdAt", "--limit", "100"],
                      capture_output=True, text=True, check=True,
                  )
                  return json.loads(out.stdout)
              except subprocess.CalledProcessError as e:
                  print("gh release list failed; stderr:", e.stderr.strip(), flush=True)
              out = subprocess.run(
                  ["gh", "api", f"repos/{repo}/releases",
                   "--paginate", "-q", ".[] | {tagName: .tag_name, createdAt: .created_at}"],
                  capture_output=True, text=True, check=True,
              )
              # -q prints one object per line, not an array.
              return [json.loads(line) for line in out.stdout.splitlines() if line.strip()]

          cur = os.environ["GITHUB_REF_NAME"]
          older = sorted(
              (r for r in query_releases() if r["tagName"] != cur),
              key=lambda r: r["createdAt"], reverse=True,
          )
          for r in older[1:]:
              print("Deleting old release:", r["tagName"], flush=True)
              subprocess.run(
                  ["gh", "release", "delete", "-R", repo, r["tagName"],
                   "--cleanup-tag", "-y"],
                  check=True,
              )
          print("Prune done.")
          EOF
            then
              break
            fi
            echo "prune query failed (attempt $attempt/3), retrying in 20s..."
            sleep 20
            if [ "$attempt" = 3 ]; then
              echo "prune query kept failing; leaving old releases in place."
              exit 1
            fi
          done
