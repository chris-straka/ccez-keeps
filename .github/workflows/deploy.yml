name: deploy

# Ship the Worker + SPA to keeps.cstraka.dev. Pushes to main (and PRs, for
# the gate) run tests + typecheck; main also rebuilds dist/, applies D1
# migrations to the remote database, and deploys. There is deliberately no
# deploy on tags — release.yml owns tags for the Android APK.
#
# One-time setup (repo Settings -> Secrets -> Actions):
#   CLOUDFLARE_API_TOKEN   API token from the "Edit Cloudflare Workers"
#                          template, plus D1:Edit (dash -> My Profile ->
#                          API Tokens -> Create Token).
#   CLOUDFLARE_ACCOUNT_ID  Account ID (Workers dashboard URL, or
#                          `wrangler whoami`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test
      - run: bunx tsc --noEmit

  # Android unit tests plus the instrumented UI tests on an emulator
  # (KVM on the hosted runner). Not a gate for the web deploy: the
  # Worker ships independently of the APK, but a red run here is red.
  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use the runner's preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests + build the test APKs
        # Sync points at a dead port so tests never touch production.
        env:
          KEEPS_BASE_URL: http://10.0.2.2:9
        run: ./gradlew :synclogic:test :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KEEPS_BASE_URL: http://10.0.2.2:9
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  deploy:
    needs: [test-web]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # One deploy at a time: two overlapping runs race the secret step
    # ("latest version of your Worker isn't currently deployed").
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Apply D1 migrations (remote)
        run: bunx wrangler@4 d1 migrations apply ccez-keeps --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy worker + assets
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Ideas feed credential (worker/ideas.ts): only the SHA-256 of the
      # reader token lives here; the raw token stays on the intake host
      # (~/.config/mediaforge/keeps-ideas.token). Unset = the feed 503s.
      - name: Set the ideas reader hash
        if: env.IDEAS_READER_SHA256 != ''
        run: printf '%s' "$IDEAS_READER_SHA256" | bunx wrangler@4 secret put IDEAS_READER_SHA256
        env:
          IDEAS_READER_SHA256: ${{ secrets.IDEAS_READER_SHA256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
